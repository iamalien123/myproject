<!DOCTYPE html>
<html>
<head>
    <title>{% if employee %}Edit{% else %}Add{% endif %} Employee</title>
    <style>
        form { max-width: 500px; margin: 0 auto; }
        .form-group { margin: 10px 0; }
        input[type="text"], input[type="number"] { width: 100%; padding: 8px; }
        input[type="submit"] { background-color: #4CAF50; color: white; padding: 10px 20px; border: none; }
    </style>
</head>
<body>
    <h1>{% if employee %}Edit{% else %}Add{% endif %} Employee</h1>
    <form method="post">
        {% csrf_token %}
        <div class="form-group">
            <label>Name:</label>
            <input type="text" name="emp_name" value="{{ employee.emp_name|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>Salary:</label>
            <input type="number" name="salary" value="{{ employee.salary|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>Department:</label>
            <input type="text" name="department" value="{{ employee.department|default:'' }}" required>
        </div>
        <div class="form-group">
            <label>Designation:</label>
            <input type="text" name="designation" value="{{ employee.designation|default:'' }}" required>
        </div>
        <input type="submit" value="{% if employee %}Update{% else %}Add{% endif %} Employee">
    </form>
</body>
</html>
