<!DOCTYPE html>
<html>
<head>
    <title>{{ product.name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.css">
    <style>
        body {
            animation: fadeIn 1s ease-in-out;
        }
        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        
        .navbar {
            transition: background-color 0.3s;
        }
        .navbar:hover {
            background-color: #343a40;
        }
        .product-image {
            max-width: 100%;
            height: auto;
            transition: transform 0.3s;
        }
        .product-image:hover {
            transform: scale(1.05);
        }
        .product-info {
            padding: 20px;
            transition: transform 0.3s, box-shadow 0.3s;
        }
        .product-info:hover {
            transform: translateY(-10px);
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
        }
        .btn-success {
            transition: background-color 0.3s, transform 0.3s;
        }
        .btn-success:hover {
            background-color: #28a745;
            transform: scale(1.05);
        }
        .btn-secondary {
            transition: background-color 0.3s, transform 0.3s;
        }
        .btn-secondary:hover {
            background-color: #6c757d;
            transform: scale(1.05);
        }

        .swiper {
            width: 100%;
            height: 400px;
            margin: 20px 0;
        }

        .swiper-slide {
            text-align: center;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 8px;
            overflow: hidden;
        }

        .swiper-slide img {
            max-width: 100%;
            height: auto;
            object-fit: cover;
            transition: transform 0.3s ease;
        }

        .swiper-slide:hover img {
            transform: scale(1.05);
        }

        .swiper-button-next,
        .swiper-button-prev {
            color: #28a745;
            transition: transform 0.3s ease;
        }

        .swiper-button-next:hover,
        .swiper-button-prev:hover {
            transform: scale(1.1);
        }

        .swiper-pagination-bullet-active {
            background: #28a745;
        }

        .thumbnail-swiper {
            height: 100px;
            box-sizing: border-box;
            padding: 10px 0;
        }

        .thumbnail-swiper .swiper-slide {
            width: 25%;
            height: 100%;
            opacity: 0.4;
            cursor: pointer;
        }

        .thumbnail-swiper .swiper-slide-thumb-active {
            opacity: 1;
        }
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="{% url 'shop:product_list' %}">My Shop</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="{% url 'shop:cart_detail' %}">Cart</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <div class="row">
            <div class="col-md-6">
                <!-- Main Swiper -->
                <div class="swiper main-swiper">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="{{ product.correct_image_url  }}" alt="{{ product.name }}">
                        </div>
                        <!-- Add more slides if you have multiple images -->
                        <div class="swiper-slide">
                            <img src="{{ product.correct_image_url  }}" alt="{{ product.name }}">
                        </div>
                        <div class="swiper-slide">
                            <img src="{{ product.correct_image_url  }}" alt="{{ product.name }}">
                        </div>
                    </div>
                    <div class="swiper-button-next"></div>
                    <div class="swiper-button-prev"></div>
                    <div class="swiper-pagination"></div>
                </div>
                
                <!-- Thumbnail Swiper -->
                <div class="swiper thumbnail-swiper">
                    <div class="swiper-wrapper">
                        <div class="swiper-slide">
                            <img src="{{ product.image.url }}" alt="{{ product.name }}">
                        </div>
                        <!-- Add more thumbnails matching the main slides -->
                        <div class="swiper-slide">
                            <img src="{{ product.image.url }}" alt="{{ product.name }}">
                        </div>
                        <div class="swiper-slide">
                            <img src="{{ product.image.url }}" alt="{{ product.name }}">
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-6 product-info">
                <h1>{{ product.name }}</h1>
                <p class="text-muted">Category: <a href="{% url 'shop:product_list_by_category' product.category.slug %}">{{ product.category.name }}</a></p>
                <p>{{ product.description }}</p>
                <h3 class="text-primary">${{ product.price }}</h3>
                <p>Stock: {{ product.stock }}</p>
                {% if product.available %}
                    <form method="post" action="{% url 'shop:add_to_cart' product.id %}">
                        {% csrf_token %}
                        <button type="submit" class="btn btn-success">Add to Cart</button>
                    </form>
                {% else %}
                    <button class="btn btn-secondary" disabled>Out of Stock</button>
                {% endif %}
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/swiper@8/swiper-bundle.min.js"></script>
    <script>
        const thumbnailSwiper = new Swiper('.thumbnail-swiper', {
            spaceBetween: 10,
            slidesPerView: 4,
            freeMode: true,
            watchSlidesProgress: true,
        });

        const mainSwiper = new Swiper('.main-swiper', {
            spaceBetween: 10,
            navigation: {
                nextEl: '.swiper-button-next',
                prevEl: '.swiper-button-prev',
            },
            pagination: {
                el: '.swiper-pagination',
                clickable: true
            },
            thumbs: {
                swiper: thumbnailSwiper,
            },
            effect: 'fade',
            fadeEffect: {
                crossFade: true
            },
            autoplay: {
                delay: 3000,
                disableOnInteraction: false,
            },
            loop: true,
            grabCursor: true,
            zoom: {
                maxRatio: 2,
                minRatio: 1,
            },
        });
    </script>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        var mainSwiper = new Swiper(".main-swiper", {
            loop: true,
            navigation: {
                nextEl: ".swiper-button-next",
                prevEl: ".swiper-button-prev",
            },
            pagination: {
                el: ".swiper-pagination",
                clickable: true,
            },
        });
    });
</script>

</body>
</html>
